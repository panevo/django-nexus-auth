[tox]
requires =
    tox>=4
envlist =
    lint
    py{310,311,312}-django52
skip_missing_interpreters = true

[testenv]
deps =
    django52: Django>=5.2.17,<5.3
    djangorestframework>=3.14.0
    djangorestframework-simplejwt>=5.4.0
    pytest
    pytest-django
    requests
commands =
    pytest {posargs}
setenv =
    DJANGO_SETTINGS_MODULE = tests.settings

[testenv:lint]
deps =
    -r requirements/linting.txt
commands =
    ruff check .
    ruff format --check .
